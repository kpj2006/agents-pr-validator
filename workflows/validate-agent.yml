name: Agent Sandbox Validator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Detect which agent folder changed
  # ───────────────────────────────────────────────────────────────────────────
  detect-agent:
    name: Detect Agent
    runs-on: ubuntu-latest
    outputs:
      agent_dir: ${{ steps.detect.outputs.agent_dir }}
      agent_type: ${{ steps.detect.outputs.agent_type }}
      entry_file: ${{ steps.detect.outputs.entry_file }}
      skip: ${{ steps.detect.outputs.skip }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect agent
        id: detect
        run: python3 scripts/detect_agent.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Run agent in sandbox + behavioral test
  # ───────────────────────────────────────────────────────────────────────────
  sandbox-test:
    name: Sandbox Test
    runs-on: ubuntu-latest
    needs: detect-agent
    if: |
      needs.detect-agent.outputs.skip != 'true' &&
      needs.detect-agent.outputs.agent_type != 'web3' &&
      needs.detect-agent.outputs.agent_type != 'frontend'
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Inject .env from secrets — matches .env.example keys automatically
      - name: Inject .env
        working-directory: ${{ needs.detect-agent.outputs.agent_dir }}
        run: python3 $GITHUB_WORKSPACE/scripts/inject_env.py --env-example .env.example --output .env
        env:
          AGENTVERSE_KEY: ${{ secrets.AGENTVERSE_KEY }}
          AGENT_SECRET_KEY: ${{ secrets.AGENT_SECRET_KEY }}
          ASI1_API_KEY: ${{ secrets.ASI1_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      - name: Install agent dependencies
        working-directory: ${{ needs.detect-agent.outputs.agent_dir }}
        run: |
          pip install --upgrade pip -q
          [ -f requirements.txt ] && pip install -r requirements.txt -q || true

      - name: Install validator dependencies
        run: pip install anthropic google-generativeai openai httpx -q

      # THE CORE: start agent, send real query, judge output
      - name: Run sandbox test
        run: |
          python3 scripts/sandbox_runner.py \
            --agent-dir "${{ needs.detect-agent.outputs.agent_dir }}" \
            --entry-file "${{ needs.detect-agent.outputs.entry_file }}" \
            --output sandbox_result.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-result
          path: sandbox_result.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Post PR comment
  # ───────────────────────────────────────────────────────────────────────────
  report:
    name: Post Report
    runs-on: ubuntu-latest
    needs: [detect-agent, sandbox-test]
    if: always() && needs.detect-agent.outputs.skip != 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download result
        uses: actions/download-artifact@v4
        with:
          name: sandbox-result
        continue-on-error: true

      - name: Generate report markdown
        run: |
          python3 scripts/generate_report.py \
            --result-file sandbox_result.json \
            --output-file final_report.md

      - name: Post / update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('final_report.md')
              ? fs.readFileSync('final_report.md', 'utf8')
              : '<!-- fetch-agent-validator -->\n⚠️ Validator failed to produce a report.';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('<!-- fetch-agent-validator -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }